<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>拾页 · PagePick</title><link rel="stylesheet" href="popup.css"></head>
<body><header><div class="brand"><img src="brand.svg" width="24" height="24" alt=""></div><div><h1>拾页 <span style="font-size:11px;font-weight:400;color:#98a0ad;margin-left:4px">PagePick</span></h1><p>捕获网页，收进你的设计文件</p></div><button id="settingsToggle" class="icon" title="工具与诊断" aria-expanded="false">⚙</button></header>
<main><div class="field"><label for="browser">浏览器环境</label><select id="browser"><option value="aside">Aside 浏览器</option><option value="chrome">Google Chrome</option><option value="edge">Microsoft Edge</option><option value="other">其他 Chromium 浏览器</option></select></div>
<div class="field"><label>导入到</label><div class="segments" role="group" aria-label="Figma 目标"><button id="webMode" type="button" aria-pressed="true">Figma 网页端</button><button id="desktopMode" type="button" aria-pressed="false">Figma 客户端</button></div><select id="mode" hidden><option value="web">网页端</option><option value="desktop">客户端</option></select></div>
<div class="field" id="webTarget"><label for="tabs">目标设计文件 <button id="refreshTabs" class="text" type="button">刷新列表</button></label><select id="tabs"></select></div>
<div class="field" id="desktopTarget" hidden><label for="title">客户端窗口</label><input id="title" placeholder="输入窗口标题关键词"><p class="hint">打开多个文件时，用标题指定目标窗口。</p></div>
<div class="field"><label for="pasteMethod">粘贴方式</label><select id="pasteMethod"><option value="native">本地助手 · 自动粘贴</option><option value="manual">仅复制 · 手动粘贴</option></select><div class="connection"><span id="connectionDot" class="dot"></span><span id="helperStatus">本地助手尚未检测</span><button id="checkHelper" class="text">检测连接</button></div></div>
<div class="field"><label for="placementEngine">自动排列</label><select id="placementEngine"><option value="plugin">Figma 排列器插件（推荐）</option><option value="off">不排列，只粘贴</option></select><div class="connection"><span id="arrangerStatus">在目标文件启动「拾页排列器」</span><button id="checkArranger" class="text">检测插件</button></div></div><div class="grid"><div class="field"><label for="width">捕获宽度</label><select id="width"><option value="0">当前宽度</option><option value="1366">1366 px</option><option value="1440">1440 px</option><option value="1920">1920 px</option></select></div><div class="field"><label for="gap">画板间隔 <span class="badge">Figma 插件</span></label><div class="unit"><input id="gap" type="number" min="0" max="10000" step="1" value="500"><span>px</span></div></div></div>
<p class="hint">第一张从 (0, 0) 开始，后续顶部对齐并向右排列。</p><button id="resetPlacement" class="text" style="margin-bottom:14px">下次重新从原点排列</button><section id="tools" hidden><div class="toolhead">工具与诊断<button id="reloadExtension" class="text">应用扩展更新</button></div><details><summary>查看最近运行记录</summary><pre id="diagnostics"></pre></details></section>
<p id="status" role="status" aria-live="polite"></p><div class="actions"><button id="cancel" class="secondary">关闭</button><button id="save" class="primary">保存设置</button></div></main>
<footer>设置保存在本机。回到网页，点击右下角导入图标开始捕获。</footer><script src="popup.js"></script></body></html>
